                  "text": "The fall of Western Rome is traditionally dated to 476 CE, when the last Western Roman Emperor, Romulus Augustulus, was deposed by the Germanic chieftain Odoacer. Odoacer then sent the imperial regalia to Constantinople, effectively signaling the end of the Western Empire.\n\nNote:\n- Some historians point to 410 CE (the Visigoths' sack of Rome) as a major milestone in the decline.\n- Others view the end as a more gradual process over decades rather than a single moment.\n- The Eastern Roman Empire (the Byzantine Empire) continued for nearly another thousand years."

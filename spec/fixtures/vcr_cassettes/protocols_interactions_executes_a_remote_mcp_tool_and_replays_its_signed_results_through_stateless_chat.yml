        [Azure samples browser](https://learn.microsoft.com/en-us/samples/browse/?expanded=azure&languages=javascript&products=azure-functions)\\n##
        Scenarios\\nHere are some common scenarios to help you get started:\\n1. [Process
        file uploads](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#process-file-uploads)\\n2.
        [Real-time stream and event processing](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#real-time-stream-and-event-processing)\\n3.
        [Machine learning and AI](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#machine-learning-and-ai)\\n4.
        [Run scheduled tasks](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#run-scheduled-tasks)\\n5.
        [Build a scalable web API](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#build-a-scalable-web-api)\\n6.
        [Build a serverless workflow](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#build-a-serverless-workflow)\\n7.
        [Respond to database changes](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#respond-to-database-changes)\\n8.
        [Create reliable message systems](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#create-reliable-message-systems)\",\"contentUrl\":\"https://learn.microsoft.com/azure/azure-functions/functions-get-started\"},{\"title\":\"Azure
        Functions diagnostics overview\",\"content\":\"# Azure Functions diagnostics
        overview\\nWhen you’re running a function app, you want to be prepared for
        any issues that may arise, from 4xx errors to trigger failures. Azure Functions
        diagnostics is an intelligent and interactive experience to help you troubleshoot
        your function app with no configuration or extra cost. When you do run into
        issues with your function app, Azure Functions diagnostics points out what’s
        wrong. It guides you to the right information to more easily and quickly troubleshoot
        and resolve the issue. This article shows you the basics of how to use Azure
        Functions diagnostics to more quickly diagnose and solve common function app
        issues.\\n## Start Azure Functions diagnostics\\nTo start Azure Functions
        diagnostics:\\n1. Navigate to your function app in the [Azure portal](https://portal.azure.com).\\n2.
        Select **Diagnose and solve problems** to open Azure Functions diagnostics.\\n3.
        Choose a category that best describes the issue of your function app by using
        the keywords in the homepage tile. You can also type a keyword that best describes
        your issue in the search bar. For example, you could type `execution` to see
        a list of diagnostic reports related to your function app execution and open
        them directly from the homepage.\\n ![Search for Azure Functions diagnostics.](https://learn.microsoft.com/azure/azure-functions/media/functions-diagnostics/functions-app-search-azure-functions-diagnostics.png)\\n##
        Use the Interactive interface\\nOnce you select a homepage category that best
        aligns with your function app''s problem, Azure Functions diagnostics'' interactive
        interface, named Genie, can guide you through diagnosing and solving problem
        of your app. You can use the tile shortcuts provided by Genie to view the
        full diagnostic report of the problem category that you''re interested in.
        The tile shortcuts provide you a direct way of accessing your diagnostic metrics.\\n![Genie
        is Azure Functions diagnostics'' interface.](https://learn.microsoft.com/azure/azure-functions/media/functions-diagnostics/genie.png)\\nAfter
        selecting a tile, you can see a list of topics related to the issue described
        in the tile. These topics provide snippets of notable information from the
        full report. Select any of these topics to investigate the issues further.
        Also, you can select **View Full Report** to explore all the topics on a single
        page.\\n![Preview of diagnostic report](https://learn.microsoft.com/azure/azure-functions/media/functions-diagnostics/preview-of-diagnostic-report.png)\",\"contentUrl\":\"https://learn.microsoft.com/azure/azure-functions/functions-diagnostics\"}]},\"isError\":false}"}},{"signature":"","type":"thought"},{"content":[{"text":"According
        to the official Microsoft documentation ([What is Azure Functions?](https://learn.microsoft.com/azure/azure-functions/functions-overview)):\n\n**Azure
        Functions** is an event-driven, serverless compute service that lets you run
        small blocks of code (functions) without managing or maintaining server infrastructure.
        \n\n### Key Highlights:\n* **Serverless Execution:** Azure automatically handles
        resource provisioning, scaling, and maintenance.\n* **Event-Driven:** Uses
        integrated **triggers** (to invoke code execution based on events such as
        HTTP requests, timers, queues, or database updates) and **bindings** (to streamline
        data input and output with external services).\n* **Multi-Language Support:**
        Supports C#, JavaScript, TypeScript, Python, Java, PowerShell, and custom
        handlers.\n* **Common Use Cases:** Building scalable web APIs, processing
        real-time streams/events, handling file uploads, running scheduled tasks,
        and orchestrating workflows (via Durable Functions).","type":"text"}],"type":"model_output"},{"type":"user_input","content":[{"type":"text","text":"What

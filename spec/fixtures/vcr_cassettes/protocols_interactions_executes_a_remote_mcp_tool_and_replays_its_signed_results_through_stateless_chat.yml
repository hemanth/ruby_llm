        |\\n\",\"contentUrl\":\"https://learn.microsoft.com/azure/azure-functions/functions-bindings-azure-sql#samples\"},{\"title\":\"What
        is Azure Functions?\",\"content\":\"# What is Azure Functions?\\nAzure Functions
        is a serverless solution that allows you to build robust apps while using
        less code, and with less infrastructure and lower costs. Instead of worrying
        about deploying and maintaining servers, you can use the cloud infrastructure
        to provide all the up-to-date resources needed to keep your applications running.\\nYou
        focus on the code that matters most to you, in the most productive language
        for you, and Azure Functions handles the rest. For a list of supported languages,
        see [Supported languages in Azure Functions](https://learn.microsoft.com/azure/azure-functions/supported-languages).\\n##
        Scenarios\\nFunctions provides a comprehensive set of event-driven [triggers
        and bindings](https://learn.microsoft.com/azure/azure-functions/functions-triggers-bindings)
        that connect your functions to other services without having to write extra
        code.\\nThe following list includes common integrated scenarios that use Functions.\\n|
        If you want to... | then...| \\n|  --- | ---  |\\n| [Process file uploads](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#process-file-uploads)
        | Run code when a file is uploaded or changed in blob storage. |\\n| [Process
        data in real time](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#real-time-stream-and-event-processing)
        | Capture and transform data from event and IoT source streams on the way
        to storage. |\\n| [Run AI inference](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#machine-learning-and-ai)
        | Pull text from a queue and present it to various AI services for analysis
        and classification. |\\n| [Run scheduled task](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#run-scheduled-tasks)
        | Execute data clean-up code on predefined timed intervals. |\\n| [Build a
        scalable web API](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#build-a-scalable-web-api)
        | Implement a set of REST endpoints for your web applications using HTTP triggers.
        |\\n| [Build a serverless workflow](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#build-a-serverless-workflow)
        | Create an event-driven workflow from a series of functions using Durable
        Functions. |\\n| [Respond to database changes](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#respond-to-database-changes)
        | Run custom logic when a document is created or updated in a database. |\\n|
        [Create reliable message systems](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#create-reliable-message-systems)
        | Process message queues using Azure Queue Storage, Service Bus, or Event
        Hubs. |\\n\\nThese scenarios allow you to build event-driven systems using
        modern architectural patterns. For more information, see [Azure Functions
        scenarios](https://learn.microsoft.com/azure/azure-functions/functions-scenarios).\",\"contentUrl\":\"https://learn.microsoft.com/azure/azure-functions/functions-overview\"},{\"title\":\"Azure
        Functions libraries for .NET\",\"content\":\"# Azure Functions libraries for
        .NET\\n## Overview\\n[Azure Functions](https://learn.microsoft.com/en-us/azure/azure-functions/functions-overview)
        is a solution for easily running small pieces of code, or *functions*, in
        Azure. Azure Functions supports a [serverless](https://azure.microsoft.com/solutions/serverless/)
        execution model.\\n## Durable Functions extension\\n*Durable Functions* is
        an extension of [Azure Functions](https://learn.microsoft.com/en-us/azure/azure-functions/functions-overview)
        that lets you write stateful functions in a serverless compute environment.
        The extension lets you define stateful workflows by writing [*orchestrator
        functions*](https://learn.microsoft.com/en-us/azure/azure-functions/durable/durable-functions-orchestrations)
        and stateful entities by writing [*entity functions*](https://learn.microsoft.com/en-us/azure/azure-functions/durable/durable-functions-entities)
        using the Azure Functions programming model. Behind the scenes, the extension
        manages state, checkpoints, and restarts for you, allowing you to focus on
        your business logic.\\nInstall the extension [NuGet package](https://www.nuget.org/packages/Microsoft.Azure.WebJobs.Extensions.DurableTask)
        directly from the Visual Studio [Package Manager console](https://learn.microsoft.com/en-us/nuget/tools/package-manager-console)
        or with the [.NET Core CLI](https://learn.microsoft.com/en-us/dotnet/core/tools/dotnet-add-package).\\nThe
        Azure API reference documentation supports [version 2.x of the Durable Functions
        extension](https://learn.microsoft.com/en-us/dotnet/api/overview/azure/functions/runtime).\\n###
        Visual Studio package manager\\n\\u0060\\u0060\\u0060powershell\\nInstall-Package
        Microsoft.Azure.WebJobs.Extensions.DurableTask\\n\\u0060\\u0060\\u0060\\n###
        .NET Core CLI\\n\\u0060\\u0060\\u0060dotnetcli\\ndotnet add package Microsoft.Azure.WebJobs.Extensions.DurableTask\\n\\u0060\\u0060\\u0060\\n###
        Getting started\\n## Samples\\nView the [complete list](https://learn.microsoft.com/en-us/samples/browse/?products=azure-functions\\u0026languages=csharp)
        of Azure Functions samples.\",\"contentUrl\":\"https://learn.microsoft.com/dotnet/api/overview/azure/functions?view=azure-dotnet#overview\"},{\"title\":\"Overview
        of Azure functions for Azure Redis (programming-language-python)\",\"content\":\"#
        Overview of Azure functions for Azure Redis (programming-language-python)\\nThis
        article describes how to use either Azure Managed Redis or Azure Cache for
        Redis with Azure Functions to create optimized serverless and event-driven
        architectures.\\nAzure Functions provides an event-driven programming model
        where triggers and bindings are key features. With Azure Functions, you can
        easily build event-driven serverless applications. Azure Redis services (Azure
        Managed Redis and Azure Cache for Redis) provide a set of building blocks
        and best practices for building distributed applications, including microservices,
        state management, pub/sub messaging, and more.\\nAzure Redis can be used as
        a trigger for Azure Functions, allowing you to initiate a serverless workflow.
        This functionality can be highly useful in data architectures like a write-behind
        cache, or any event-based architectures.\\nYou can integrate Azure Redis and
        Azure Functions to build functions that react to events from Azure Redis or
        external systems.\\n| Action | Direction| \\n|  --- | ---  |\\n| [Trigger
        on Redis pub sub messages](https://learn.microsoft.com/azure/azure-functions/functions-bindings-cache-trigger-redispubsub)
        | Trigger |\\n| [Trigger on Redis lists](https://learn.microsoft.com/azure/azure-functions/functions-bindings-cache-trigger-redislist)
        | Trigger |\\n| [Trigger on Redis streams](https://learn.microsoft.com/azure/azure-functions/functions-bindings-cache-trigger-redisstream)
        | Trigger |\\n| [Read a cached value](https://learn.microsoft.com/azure/azure-functions/functions-bindings-cache-input)
        | Input |\\n| [Write a values to cache](https://learn.microsoft.com/azure/azure-functions/functions-bindings-cache-output)
        | Output |\\n\\n## Scope of availability for functions triggers and bindings\\n|
        Tier | Azure Cache for Redis (Basic, Standard, Premium, Enterprise, Enterprise
        Flash) | Azure Managed Redis (Memory Optimized, Basic, Compute Optimized,
        Flash Optimized)| \\n|  --- | --- | ---  |\\n| Pub/Sub | Yes | Yes |\\n| Lists
        | Yes | Yes |\\n| Streams | Yes | Yes |\\n| Bindings | Yes | Yes |\\n\\nImportant\\nRedis
        triggers are currently only supported for functions running in either a [Elastic
        Premium plan](https://learn.microsoft.com/azure/azure-functions/functions-premium-plan)
        or a dedicated [App Service plan](https://learn.microsoft.com/azure/azure-functions/dedicated-plan).\",\"contentUrl\":\"https://learn.microsoft.com/azure/azure-functions/functions-bindings-cache\"},{\"title\":\"Get
        started with Azure Functions (programming-language-csharp)\",\"content\":\"#
        Get started with Azure Functions (programming-language-csharp)\\nAzure Functions
        lets you implement your system\\u0027s logic as event-driven, readily available
        blocks of code. These code blocks are called functions. This article helps
        you find the most useful Azure Functions content quickly. For more general
        information about Azure Functions, see the [Introduction to Azure Functions](https://learn.microsoft.com/azure/azure-functions/functions-overview).\\nChoose
        your preferred development language at the top of the article.\\n## Create
        your first function\\nComplete a quickstart article to create and deploy your
        first functions in less than five minutes.\\nYou can create your first function
        by using one of the following tools:\\n1. [Azure Developer CLI (azd)](https://learn.microsoft.com/azure/azure-functions/create-first-function-azure-developer-cli)\\n2.
        [Command line](https://learn.microsoft.com/azure/azure-functions/how-to-create-function-azure-cli)\\n3.
        [Visual Studio Code](https://learn.microsoft.com/azure/azure-functions/how-to-create-function-vs-code)\\n4.
        [Visual Studio](https://learn.microsoft.com/azure/azure-functions/functions-create-your-first-function-visual-studio)\\n##
        Review end-to-end samples\\nThese sites let you browse existing functions
        reference projects and samples in your desired language:\\n1. [Awesome azd
        template library](https://azure.github.io/awesome-azd/?tags=functions\\u0026tags=dotnetCsharp)\\n2.
        [Azure Functions samples in GitHub](https://github.com/search?q=topic%3Aazure-functions\\u002Borg%3AAzure-Samples\\u002Bfork%3Atrue\\u002Blanguage%3AC%23\\u0026type=repositories\\u0026l=C%23)\\n3.
        [Azure samples browser](https://learn.microsoft.com/en-us/samples/browse/?expanded=azure\\u0026languages=csharp\\u0026products=azure-functions)\\n##
        Scenarios\\nHere are some common scenarios to help you get started:\\n1. [Process
        file uploads](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#process-file-uploads)\\n2.
        [Real-time stream and event processing](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#real-time-stream-and-event-processing)\\n3.
        [Machine learning and AI](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#machine-learning-and-ai)\\n4.
        [Run scheduled tasks](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#run-scheduled-tasks)\\n5.
        [Build a scalable web API](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#build-a-scalable-web-api)\\n6.
        [Build a serverless workflow](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#build-a-serverless-workflow)\\n7.
        [Respond to database changes](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#respond-to-database-changes)\\n8.
        [Create reliable message systems](https://learn.microsoft.com/azure/azure-functions/functions-scenarios#create-reliable-message-systems)\",\"contentUrl\":\"https://learn.microsoft.com/azure/azure-functions/functions-get-started\"},{\"title\":\"Get

                  "text": "Ask:\n\n**\u201cWill your answer to this question be \u2018no\u2019?\u201d**\n\nWhy this works:\n\n- If the mirror answers **\u201cyes,\u201d** then its answer is not \u201cno,\u201d so \u201cyes\u201d is false.\n- If the mirror answers **\u201cno,\u201d** then its answer is \u201cno,\u201d which makes the statement true, so \u201cno\u201d is false.\n\nSo the mirror **cannot answer truthfully** either way.\n\nThat triggers the condition, and instead of giving a reliable verbal answer, it would show **your future self**.\n\nWhat would the mirror reveal about the answer it gives?\n\nIt would reveal that **the spoken answer is necessarily a lie**, and that the **only truthful response available is the vision itself**. In other words, the mirror\u2019s words would be false, but the image of your future self would be the one thing it can still \u201csay\u201d honestly."

        event: response.reasoning_summary_text.delta
        data: {"sequence_number":47,"type":"response.reasoning_summary_text.delta","delta":"Ask the mirror: \"Will you show me my future self?\"\n\nThe mirror cannot answer this truthfully because:\n- If it says \"yes,\" then it would be showing your future self, but that means it just answered the question truthfully, which contradicts the rule that it only shows the future when it can't answer truthfully.","item_id":"rs_698a14b2-53da-98b6-aeee-bbda2c629140","output_index":0,"summary_index":0}

        event: response.reasoning_summary_text.delta
        data: {"sequence_number":48,"type":"response.reasoning_summary_text.delta","delta":"\n- If it says \"no,\" then it would be answering truthfully (since it won't show the future), again contradicting the rule.","item_id":"rs_698a14b2-53da-98b6-aeee-bbda2c629140","output_index":0,"summary_index":0}

        event: response.reasoning_summary_text.delta
        data: {"sequence_number":49,"type":"response.reasoning_summary_text.delta","delta":"\n\nSo it has no truthful response and instead shows your future self.","item_id":"rs_698a14b2-53da-98b6-aeee-bbda2c629140","output_index":0,"summary_index":0}

        event: response.reasoning_summary_text.delta
        data: {"sequence_number":50,"type":"response.reasoning_summary_text.delta","delta":" The mirror reveals that it gave an answer it couldn't truthfully provide by displaying your future self as the only way to respond.","item_id":"rs_698a14b2-53da-98b6-aeee-bbda2c629140","output_index":0,"summary_index":0}

        event: response.reasoning_summary_text.done
